name: Deploy to WPEngine

# ─────────────────────────────────────────────────────────────
# PROJECT SETUP — set these in GitHub → Settings → Variables:
#   THEME_SLUG          e.g. my-theme-name
#   WPE_ENV_PRODUCTION  e.g. myclientprod
#   WPE_ENV_STAGING     e.g. myclientstg
#   WPE_ENV_DEV         e.g. myclientdev
#
# And in GitHub → Settings → Secrets:
#   WPE_SSHG_KEY_PRIVATE  (WPEngine Git Push SSH private key)
#
# Every job is skipped until THEME_SLUG is set, so the
# boilerplate (and new projects) don't attempt to deploy.
#
# Flow
#   Push / merge to develop               → build, deploy to Staging
#   Push / merge to main                  → build, deploy to Production
#   Pull request labelled deploy-dev      → build, deploy to Dev
#   Actions tab → "Run workflow"          → build, deploy to the chosen install
#
# The theme is built once (the "build" job) and that build is what's
# deployed. The workflow never activates the theme: activate it in
# WP Admin → Appearance → Themes, then rerun the workflow so
# post-deploy.sh builds Acorn's caches (it skips them while another
# theme is active). See .github/scripts/post-deploy.sh.
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # Works out which install this run deploys to; an empty target skips the build and deploy.
  target:
    if: vars.THEME_SLUG != ''
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      wpe_env: ${{ steps.resolve.outputs.wpe_env }}
    steps:
      - name: Resolve target environment
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          DEPLOY_DEV_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'deploy-dev') }}
          WPE_ENV_DEV: ${{ vars.WPE_ENV_DEV }}
          WPE_ENV_STAGING: ${{ vars.WPE_ENV_STAGING }}
          WPE_ENV_PRODUCTION: ${{ vars.WPE_ENV_PRODUCTION }}
        run: |
          environment=''
          if [ "$EVENT" = "workflow_dispatch" ]; then
            environment="$INPUT_ENV"
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            environment=production
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/develop" ]; then
            environment=staging
          elif [ "$EVENT" = "pull_request" ] && [ "$SAME_REPO" = "true" ] && [ "$DEPLOY_DEV_LABEL" = "true" ]; then
            environment=dev
          fi

          case "$environment" in
            dev) wpe_env="$WPE_ENV_DEV" ;;
            staging) wpe_env="$WPE_ENV_STAGING" ;;
            production) wpe_env="$WPE_ENV_PRODUCTION" ;;
            *) wpe_env='' ;;
          esac

          if [ -n "$environment" ] && [ -z "$wpe_env" ]; then
            echo "::error::No WP Engine install is set for $environment (repository variable WPE_ENV_${environment^^})."
            exit 1
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "wpe_env=$wpe_env" >> "$GITHUB_OUTPUT"
          echo "Target: ${environment:-none} ${wpe_env}"

  build:
    needs: target
    if: needs.target.outputs.environment != ''
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install Node dependencies
        run: npm ci --include=optional

      - name: Ensure Linux Rolldown binary
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" || npm i --no-save @rolldown/binding-linux-x64-gnu

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Build assets
        run: npm run build

      - name: Package theme
        run: |
          mkdir -p "$RUNNER_TEMP/theme"
          tar --exclude=./node_modules --exclude=./.git --exclude=./.github --exclude=./tests \
            --exclude=./CLAUDE.md --exclude=./.claude --exclude=./auth.json --exclude=./.env \
            -cf - . | tar -xf - -C "$RUNNER_TEMP/theme"

      - uses: actions/upload-artifact@v4
        with:
          name: theme
          path: ${{ runner.temp }}/theme
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: [target, build]
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.target.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.target.outputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theme
          path: theme

      - name: Deploy to WPEngine (${{ needs.target.outputs.environment }})
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ needs.target.outputs.wpe_env }}
          SRC_PATH: theme/
          REMOTE_PATH: "wp-content/themes/${{ vars.THEME_SLUG }}/"
          FLAGS: -azvr --inplace --delete --exclude=node_modules/ --exclude=.git/ --exclude=.github/ --exclude=tests/ --exclude=.stylelintrc --exclude=eslint.config.js --exclude=.env --exclude=.env.* --exclude=.editorconfig --exclude=.gitignore --exclude=.gitattributes --exclude=README.md --exclude=CLAUDE.md --exclude=.claude/ --exclude=auth.json
          CACHE_CLEAR: true

      # The theme artifact leaves .github out, so check out just the script.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: repo

      - name: Rebuild Acorn cache
        env:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ needs.target.outputs.wpe_env }}
          THEME_SLUG: ${{ vars.THEME_SLUG }}
        run: bash repo/.github/scripts/post-deploy.sh
